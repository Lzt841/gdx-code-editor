name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Verify library and demos
        run: ./gradlew :core:test :core:jar :core:sourcesJar :lwjgl3:compileJava :lwjgl3:compileTestJava :android:compileDebugJavaWithJavac
